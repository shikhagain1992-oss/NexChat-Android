name: NexChat Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'NexChat-Android-Phase4-Fixed1.zip'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract NexChat source
        run: |
          unzip -q NexChat-Android-Phase4-Fixed1.zip -d .
          test -f NexChat-Android/pubspec.yaml
          sed -i "/mavenCentral()/a\\        jcenter()" NexChat-Android/android/build.gradle

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.7.12'
          channel: stable

      - name: Prepare temporary build config
        working-directory: NexChat-Android
        run: |
          mkdir -p android/app
          cat > android/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "123456789",
              "project_id": "nexchat-build-check",
              "storage_bucket": "nexchat-build-check.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789:android:123456789abcdef0",
                "android_client_info": {
                  "package_name": "com.nexchat.android"
                }
              },
              "api_key": [{
                "current_key": "BUILD_CHECK_ONLY"
              }],
              "services": {}
            }],
            "configuration_version": "1"
          }
          EOF

      - name: Install dependencies
        working-directory: NexChat-Android
        run: flutter pub get

      - name: Build debug APK
        working-directory: NexChat-Android
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NexChat-Android-Debug-APK
          path: NexChat-Android/build/app/outputs/flutter-apk/app-debug.apk
